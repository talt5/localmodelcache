# Replace the container that downloads models whose URI matches a prefix or regex.
#
# Only ClusterStorageContainers with workloadType localModelDownloadJob are used for model
# cache downloads. Without a match, download Jobs use defaultJobImage from the localModel key
# of the kserve-localmodel-config ConfigMap. The container receives the source URI and the
# destination directory as its two arguments.
apiVersion: local.cache.ai/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: internal-registry-downloader
spec:
  workloadType: localModelDownloadJob
  supportedUriFormats:
    - prefix: s3://
  container:
    name: storage-initializer
    image: registry.example.com/kserve/storage-initializer:v0.21.0
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: "1"
        memory: 1Gi
