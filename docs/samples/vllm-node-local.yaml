# Cache a model on the local disks of a node group and serve it with vLLM.
#
# The node agent downloads the model to <hostPath>/models/<storage key> on every node of
# the group. The LocalModelNamespaceCache creates the PVC qwen3-gpu in its namespace. The root
# of the claim is the model's folder, and its volume is pinned to the node group. Deploy once
# every node has the model:
#
#   kubectl get localmodelnamespacecache qwen3 -n inference -o jsonpath='{.status.copies}'
---
apiVersion: serving.kserve.io/v1alpha1
kind: LocalModelNodeGroup
metadata:
  name: gpu
spec:
  storageLimit: 200Gi
  persistentVolumeSpec:
    accessModes: [ReadWriteOnce]
    capacity:
      storage: 200Gi
    local:
      # Must match the node agent's host path (kserve.localmodelnode.controller.hostPath).
      # On OpenShift use /var/mnt/models.
      path: /mnt/models
    storageClassName: local-storage
    nodeAffinity:
      required:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kserve/localmodel
                operator: In
                values: [worker]
  persistentVolumeClaimSpec:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 200Gi
    storageClassName: local-storage
---
apiVersion: serving.kserve.io/v1alpha1
kind: LocalModelNamespaceCache
metadata:
  name: qwen3
  namespace: inference
spec:
  sourceModelUri: hf://Qwen/Qwen3-0.6B
  modelSize: 2Gi
  nodeGroups: [gpu]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3
  template:
    metadata:
      labels:
        app: qwen3
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--model", "/models/qwen3", "--served-model-name", "qwen3"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model
              mountPath: /models/qwen3
              readOnly: true
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen3-gpu
            # Without this, OpenShift relabels the files so that only this Pod can read them.
            readOnly: true
