# Import a model once into a ReadWriteMany PVC and serve it with vLLM.
#
# The controller runs one import Job in the cache's namespace that writes the model to
# models/<storage key> on the claim. Read the subPath to mount from the cache's status:
#
#   kubectl get localmodelnamespacecache qwen3-shared -n inference -o jsonpath='{.status.subPath}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
  namespace: inference
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Filesystem
  storageClassName: REPLACE_WITH_AN_RWX_STORAGE_CLASS
  resources:
    requests:
      storage: 50Gi
---
apiVersion: local.cache.ai/v1alpha1
kind: LocalModelNamespaceCache
metadata:
  name: qwen3-shared
  namespace: inference
spec:
  sourceModelUri: hf://Qwen/Qwen3-0.6B
  modelSize: 2Gi
  pvcRef: model-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-shared
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qwen3-shared
  template:
    metadata:
      labels:
        app: qwen3-shared
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--model", "/models/qwen3", "--served-model-name", "qwen3"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model
              mountPath: /models/qwen3
              subPath: models/REPLACE_WITH_STATUS_SUBPATH_KEY
              readOnly: true
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-store
            readOnly: true
