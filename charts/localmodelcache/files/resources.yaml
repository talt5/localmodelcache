apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: kernelcache-root-ca
  namespace: localmodelcache
spec:
  commonName: kernelcache-root-ca
  duration: 8760h
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: localmodel-selfsigned-issuer
  secretName: kernelcache-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: kernelcache-signer
  namespace: localmodelcache
spec:
  commonName: kernelcache-signer
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: kernelcache-ca
  secretName: kernelcache-signer
  uris:
  - spiffe://localmodelcache/kernelcache-signer
  usages:
  - digital signature
  - code signing
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodel-serving-cert
  namespace: localmodelcache
spec:
  commonName: localmodel-webhook-server-service.localmodelcache.svc
  dnsNames:
  - localmodel-webhook-server-service.localmodelcache.svc
  issuerRef:
    kind: Issuer
    name: localmodel-selfsigned-issuer
  secretName: localmodel-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: kernelcache-ca
  namespace: localmodelcache
spec:
  ca:
    secretName: kernelcache-root-ca
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodel-selfsigned-issuer
  namespace: localmodelcache
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: localmodelcache/localmodel-serving-cert
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: kernelcache.local.cache.ai
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: localmodel-webhook-server-service
      namespace: localmodelcache
      path: /mutate-kernelcache-pods
  failurePolicy: Fail
  matchConditions:
  - expression: has(object.metadata.annotations) && 'local.cache.ai/kernelcache-supported'
      in object.metadata.annotations && object.metadata.annotations['local.cache.ai/kernelcache-supported']
      == 'true'
    name: kernelcache-opt-in
  name: kernelcache-pod-mutator.webhook.local.cache.ai
  namespaceSelector:
    matchExpressions:
    - key: control-plane
      operator: DoesNotExist
  reinvocationPolicy: IfNeeded
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: localmodelcache/localmodel-serving-cert
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: kernelcachecapture.local.cache.ai
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: localmodel-webhook-server-service
