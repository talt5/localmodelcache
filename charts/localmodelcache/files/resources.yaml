apiVersion: v1
data:
  credentials: |-
    {
       "storageSpecSecretName": "storage-config",
       "storageSecretNameAnnotation": "local.cache.ai/storageSecretName",
       "gcs": {
           "gcsCredentialFileName": "gcloud-application-credentials.json"
       },
       "s3": {
           "s3AccessKeyIDName": "AWS_ACCESS_KEY_ID",
           "s3SecretAccessKeyName": "AWS_SECRET_ACCESS_KEY",
           "s3Endpoint": "",
           "s3UseHttps": "",
           "s3Region": "",
           "s3VerifySSL": "",
           "s3UseVirtualBucket": "",
           "s3UseAccelerate": "",
           "s3UseAnonymousCredential": "",
           "s3CABundleConfigMap": "",
           "s3CABundle": ""
       }
    }
  kernelcache: |-
    {
      "enabled": false,
      "defaultSidecarInjection": true,
      "defaultMountType": "oci",
      "defaultNodeGroup": "",
      "jobNamespace": "localmodelcache-kernelcache-jobs",
      "mcvImage": "ghcr.io/talt5/localmodelcache-mcv:latest-minimal",
      "prefetchImage": "registry.access.redhat.com/ubi9/ubi-minimal:latest",
      "runtimeImagePrefetch": {
        "enabled": false,
        "jobTTLSecondsAfterFinished": 86400
      },
      "registry": {
        "auth": {
          "type": "none"
        }
      },
      "artifactSecurity": {
        "mode": "cert",
        "failurePolicy": "reject",
        "cert": {
          "signingProfileRef": "kernelcache-signer",
          "subjectRegexp": "spiffe://localmodelcache/kernelcache-signer"
        }
      },
      "abandonedCapturePolicy": "retain",
      "jobTTLSecondsAfterFinished": 600,
      "mcvCaptureReadinessTimeoutSeconds": 600,
      "reconcileIntervalSeconds": 300
    }
  localModel: |-
    {
      "jobNamespace": "localmodelcache-jobs",
      "defaultJobImage": "ghcr.io/talt5/localmodelcache-storage-initializer:latest",
      "fsGroup": 1000,
      "sharedPVCImportFSGroup": 1000,
      "jobTTLSecondsAfterFinished": 3600,
      "reconcilationFrequencyInSecs": 60,
      "disableVolumeManagement": false
    }
  storageInitializer: |-
    {
        "image" : "ghcr.io/talt5/localmodelcache-storage-initializer:latest",
        "memoryRequest": "100Mi",
        "memoryLimit": "4Gi",
        "cpuRequest": "100m",
        "cpuLimit": "2",
        "caBundleConfigMapName": "",
        "caBundleVolumeMountPath": "/etc/ssl/custom-certs"
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodelcache-config
  namespace: localmodelcache
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodel-webhook-server-service
  namespace: localmodelcache
spec:
  ports:
  - port: 443
    targetPort: webhook-server
  selector:
    control-plane: localmodelcache-controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
    control-plane: localmodelcache-controller-manager
    controller-tools.k8s.io: "1.0"
  name: localmodelcache-controller-manager
  namespace: localmodelcache
spec:
  selector:
    matchLabels:
      control-plane: localmodelcache-controller-manager
      controller-tools.k8s.io: "1.0"
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: localmodelcache-controller-manager
        control-plane: localmodelcache-controller-manager
        controller-tools.k8s.io: "1.0"
    spec:
      containers:
      - command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/talt5/localmodelcache-controller:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          timeoutSeconds: 5
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: localmodelcache-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: localmodel-webhook-server-cert
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
    control-plane: localmodelcache-kernelcache-agent
  name: localmodelcache-kernelcache-agent
  namespace: localmodelcache
spec:
  selector:
    matchLabels:
      control-plane: localmodelcache-kernelcache-agent
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: localmodelcache-kernelcache-agent
        control-plane: localmodelcache-kernelcache-agent
    spec:
      containers:
      - command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: ghcr.io/talt5/localmodelcache-kernelcache-agent:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 356Mi
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: localmodelcache-kernelcache-agent
      terminationGracePeriodSeconds: 10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: localmodel
