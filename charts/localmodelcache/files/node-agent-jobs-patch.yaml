# What the node agent may do in the namespace of the download Jobs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodelcache-node-agent-jobs-role
  namespace: {{ .Values.localmodelcache.localmodel.jobNamespace }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - serviceaccounts
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/name: localmodelcache
  name: localmodelcache-node-agent-jobs-rolebinding
  namespace: {{ .Values.localmodelcache.localmodel.jobNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: localmodelcache-node-agent-jobs-role
subjects:
- kind: ServiceAccount
  name: localmodelcache-node-agent
  namespace: {{ .Release.Namespace }}
