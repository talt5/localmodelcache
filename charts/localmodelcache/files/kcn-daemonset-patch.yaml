---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: localmodelcache-kernelcache-agent
spec:
  template:
    spec:
      # The controller sets the affinity and tolerations from the KernelCacheNodeGroups. Set
      # neither here, or server-side apply refuses the next upgrade.
      {{- if not .Values.localmodelcache.kernelcache.enabled }}
      # Matches no node.
      nodeSelector:
        local.cache.ai/kernelcache-agent: disabled
      {{- end }}
      containers:
      - name: manager
        image: "{{ .Values.localmodelcache.kernelcachenode.controller.image }}:{{ .Values.localmodelcache.kernelcachenode.controller.tag | default .Values.localmodelcache.version }}"
        {{- with .Values.localmodelcache.kernelcachenode.controller.extraArgs }}
        args:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        imagePullPolicy: {{ .Values.localmodelcache.kernelcachenode.controller.imagePullPolicy }}
        resources:
          {{- toYaml .Values.localmodelcache.kernelcachenode.controller.resources | nindent 10 }}
  {{- if .Values.openshift.enabled }}
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
  {{- end }}
