localmodelcache:
  version: v0.3.0
  # -- Create localmodel.jobNamespace, and kernelcache.jobNamespace when the kernel cache is enabled, if they do not exist. They are kept when the release is uninstalled. If false, create them before you install the chart.
  createJobNamespaces: true
  storage:
    image: ghcr.io/talt5/localmodelcache-storage-initializer
    tag: ''
    resources:
      requests:
        memory: 100Mi
        cpu: 100m
      limits:
        memory: 4Gi
        cpu: '2'
    # enableOciModelSupport turns on any OCI-backed model storage path (modelcar,
    # native ImageVolume, or fetch). Only rendered into the storageInitializer
    # config when true, so the default leaves the shipped config untouched.
    enableOciModelSupport: false
    # ociModelMode picks the materialization strategy for oci:// storageUris that
    # carry no explicit suffix. One of: modelcar | native | fetch.
    # Only rendered into the storageInitializer config when non-empty.
    ociModelMode: ''
    # -- ConfigMap with the CA certificates (key cabundle.crt) that downloads trust. Create it in every namespace that runs download Jobs: localmodelcache.localmodel.jobNamespace, and the namespace of each shared-PVC cache. A ConfigMap named by the storage credentials takes precedence.
    caBundleConfigMapName: ''
    caBundleVolumeMountPath: /etc/ssl/custom-certs
    storageSpecSecretName: storage-config
    storageSecretNameAnnotation: local.cache.ai/secretName
    s3:
      accessKeyIdName: AWS_ACCESS_KEY_ID
      secretAccessKeyName: AWS_SECRET_ACCESS_KEY
      endpoint: ''
      useHttps: ''
      region: ''
      verifySSL: ''
      useVirtualBucket: ''
      useAnonymousCredential: ''
      CABundleConfigMap: ''
      CABundle: ''
  localmodel:
    controller:
      image: ghcr.io/talt5/localmodelcache-controller
      tag: ''
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
    jobNamespace: localmodelcache-jobs
    jobTTLSecondsAfterFinished: 3600
    defaultJobImage: ghcr.io/talt5/localmodelcache-storage-initializer
    defaultJobTag: ''
    securityContext:
      fsGroup: 1000
    # -- (int) fsGroup for shared-PVC import Jobs, which run in the cache's namespace. Independent of securityContext.fsGroup (per-node download Jobs). Set to null to omit it and let namespace admission (e.g. an OpenShift SCC) assign the group.
    sharedPVCImportFSGroup: 1000
    disableVolumeManagement: false
    agent:
      reconcilationFrequencyInSecs: 60
  kernelcache:
    enabled: false
    defaultSidecarInjection: true
    defaultMountType: 'oci'
    defaultNodeGroup: ''
    jobNamespace: 'localmodelcache-kernelcache-jobs'
    mcvImage: 'ghcr.io/talt5/localmodelcache-mcv'
    mcvTag: ''
    prefetchImage: 'registry.access.redhat.com/ubi9/ubi-minimal:latest'
    prefetchTag: ''
    runtimeImagePrefetch:
      enabled: false
      jobTTLSecondsAfterFinished: 86400
    registry:
      endpoint: ''
      # -- Push and pull cache images over plain HTTP, for a test registry without TLS. It excludes caConfigMapRef and the serviceAccountToken auth type, and the nodes' container runtime must allow the registry too.
      insecure: false
      caConfigMapRef:
        name: ''
        key: ''
      auth:
        type: 'none'
        tokenTTLSeconds: 600
        pushRoleRef:
          kind: ''
          name: ''
        pullRoleRef:
          kind: ''
          name: ''
    artifactSecurity:
      mode: 'cert'
      failurePolicy: 'reject'
      cert:
        signingProfileRef: 'kernelcache-signer'
        # -- Secret or ConfigMap (namespace/name) with the CA that artifacts must be signed by. Empty uses kernelcache-root-ca in the release namespace.
        trustBundle: ''
        trustBundleKey: ''
        subjectRegexp: 'spiffe://localmodelcache/kernelcache-signer'
    abandonedCapturePolicy: 'retain'
    jobTTLSecondsAfterFinished: 600
    mcvCaptureReadinessTimeoutSeconds: 600
    reconcileIntervalSeconds: 300
  localmodelnode:
    controller:
      image: ghcr.io/talt5/localmodelcache-node-agent
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
      nodeSelector:
        local.cache.ai/node: worker
      affinity: {}
      # -- Tolerations of the node agent, and of the download Jobs it creates on its node. Example: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}].
      tolerations: []
      # -- Node directory that holds the model cache. It must match the path of the PersistentVolume in your LocalModelNodeGroup. On OpenShift (RHCOS) the root filesystem is immutable, so use a path under /var, such as /var/mnt/models.
      hostPath: /mnt/models
  kernelcachenode:
    controller:
      image: ghcr.io/talt5/localmodelcache-kernelcache-agent
      # -- Additional container arguments.
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 128Mi
openshift:
  # -- Deploy on OpenShift. Creates SecurityContextConstraints (SCCs), grants them to the chart's ServiceAccounts and the download Job ServiceAccount, and pins each pod to its SCC.
  enabled: false
  # -- ServiceAccount in localmodelcache.localmodel.jobNamespace that runs the model download Jobs. It is granted the download Job SCC, which permits the Jobs' fsGroup.
  downloadJobServiceAccount: default
  # -- fsGroup of shared-PVC import Jobs on OpenShift, replacing localmodelcache.localmodel.sharedPVCImportFSGroup. The Jobs run in the cache's namespace under restricted-v2, which rejects a group outside the namespace's range. Leave it null so admission assigns the namespace's group, which the pods mounting the claim also get.
  sharedPVCImportFSGroup: null
  localmodelnode:
    # -- UID the node agent runs as. It owns the model cache on the node.
    runAsUser: 1000
    # -- GID the node agent runs as. Download Jobs share it through their fsGroup (localmodelcache.localmodel.securityContext.fsGroup), so both can write the cache.
    runAsGroup: 1000
    # -- SELinux type for the node agent pod, including its init container. spc_t lets the agent read cache files whatever SELinux categories the pods that wrote or mounted them used, and lets the init container relabel the host directory. Empty uses the runtime default (container_t).
    seLinuxType: spc_t
    prepareHostPath:
      # -- Run an init container that creates the cache directory, gives it to runAsUser:runAsGroup and labels it container_file_t so SELinux lets pods write it. Disable it if you prepare the nodes yourself, for example with a MachineConfig.
      enabled: true
      # -- Image for the init container. It needs sh, mkdir, chown, chmod and chcon.
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
