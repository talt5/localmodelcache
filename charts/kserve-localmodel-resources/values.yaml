kserve:
  version: v0.21.0
  createSharedResources: true
  inferenceServiceConfig:
    enabled: ''
  certManager:
    enabled: ''
  storagecontainer:
    enabled: ''
  agent:
    image: kserve/agent
    tag: ''
  router:
    image: kserve/router
    tag: ''
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
  service:
    serviceClusterIPNone: false
  storage:
    image: kserve/storage-initializer
    tag: ''
    resources:
      requests:
        memory: 100Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: '1'
    containerSecurityContext:
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    enableModelcar: true
    uidModelcar: 1010
    cpuModelcar: 10m
    memoryModelcar: 15Mi
    # enableOciModelSupport turns on any OCI-backed model storage path (modelcar,
    # native ImageVolume, or fetch). Only rendered into the storageInitializer
    # config when true, so the default leaves the shipped config untouched.
    enableOciModelSupport: false
    # ociModelMode picks the materialization strategy for oci:// storageUris that
    # carry no explicit suffix. One of: modelcar | native | fetch.
    # Only rendered into the storageInitializer config when non-empty.
    ociModelMode: ''
    caBundleConfigMapName: ''
    caBundleVolumeMountPath: /etc/ssl/custom-certs
    storageSpecSecretName: storage-config
    storageSecretNameAnnotation: serving.kserve.io/secretName
    s3:
      accessKeyIdName: AWS_ACCESS_KEY_ID
      secretAccessKeyName: AWS_SECRET_ACCESS_KEY
      endpoint: ''
      useHttps: ''
      region: ''
      verifySSL: ''
      useVirtualBucket: ''
      useAnonymousCredential: ''
      CABundleConfigMap: ''
      CABundle: ''
  metricsaggregator:
    enableMetricAggregation: 'false'
    enablePrometheusScraping: 'false'
  servingruntime:
    art:
      image: kserve/art-explainer
      defaultVersion: ''
  localmodel:
    enabled: false
    controller:
      image: kserve/kserve-localmodel-controller
      tag: ''
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
    jobNamespace: kserve-localmodel-jobs
    jobTTLSecondsAfterFinished: 3600
    defaultJobImage: kserve/storage-initializer
    defaultJobTag: ''
    securityContext:
      fsGroup: 1000
    # -- (int) fsGroup for shared-PVC import Jobs, which run in the cache's namespace. Independent of securityContext.fsGroup (per-node download Jobs). Set to null to omit it and let namespace admission (e.g. an OpenShift SCC) assign the group.
    sharedPVCImportFSGroup: 1000
    disableVolumeManagement: false
    agent:
      nodeSelector: {}
      affinity: {}
      tolerations: []
      hostPath: /mnt/models
      image: kserve/kserve-localmodelnode-agent
      tag: ''
      reconcilationFrequencyInSecs: 60
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
  kernelcache:
    enabled: false
    defaultSidecarInjection: true
    defaultMountType: 'oci'
    defaultNodeGroup: ''
    jobNamespace: 'kserve-kernelcache-jobs'
    mcvImage: 'kserve/kserve-mcv'
    mcvTag: ''
    prefetchImage: 'registry.access.redhat.com/ubi9/ubi-minimal:latest'
    prefetchTag: ''
    runtimeImagePrefetch:
      enabled: false
      jobTTLSecondsAfterFinished: 86400
    registry:
      endpoint: ''
      caConfigMapRef:
        name: ''
        key: ''
      auth:
        type: 'none'
        tokenTTLSeconds: 600
        pushRoleRef:
          kind: ''
          name: ''
        pullRoleRef:
          kind: ''
          name: ''
    artifactSecurity:
      mode: 'cert'
      failurePolicy: 'reject'
      cert:
        signingProfileRef: 'kernelcache-signer'
        trustBundle: 'kserve/kernelcache-root-ca'
        trustBundleKey: ''
        subjectRegexp: 'spiffe://kserve/kernelcache-signer'
    abandonedCapturePolicy: 'retain'
    jobTTLSecondsAfterFinished: 600
    mcvCaptureReadinessTimeoutSeconds: 600
    reconcileIntervalSeconds: 300
  security:
    autoMountServiceAccountToken: true
  inferenceservice:
    resources:
      limits:
        cpu: '1'
        memory: 2Gi
      requests:
        cpu: '1'
        memory: 2Gi
  opentelemetryCollector:
    scrapeInterval: 5s
    metricReceiverEndpoint: keda-otel-scaler.keda.svc:4317
    metricScalerEndpoint: keda-otel-scaler.keda.svc:4318
    resource:
      cpuLimit: '1'
      memoryLimit: 2Gi
      cpuRequest: 200m
      memoryRequest: 512Mi
  autoscaler:
    scaleUpStabilizationWindowSeconds: '0'
    scaleDownStabilizationWindowSeconds: '300'
  localmodelnode:
    controller:
      image: kserve/kserve-localmodelnode-agent
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
      nodeSelector:
        kserve/localmodel: worker
      affinity: {}
      tolerations: []
      # -- Node directory that holds the model cache. It must match the path of the PersistentVolume in your LocalModelNodeGroup. On OpenShift (RHCOS) the root filesystem is immutable, so use a path under /var, such as /var/mnt/models.
      hostPath: /models
  kernelcachenode:
    controller:
      image: kserve/kserve-kernelcachenode-agent
      # -- Additional container arguments.
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 128Mi
      affinity: {}
      tolerations: []
openshift:
  # -- Deploy on OpenShift. Creates SecurityContextConstraints (SCCs), grants them to the chart's ServiceAccounts and the download Job ServiceAccount, and pins each pod to its SCC.
  enabled: false
  # -- ServiceAccount in kserve.localmodel.jobNamespace that runs the model download Jobs. It is granted the download Job SCC, which permits the Jobs' fsGroup.
  downloadJobServiceAccount: default
  # -- fsGroup of shared-PVC import Jobs on OpenShift, replacing kserve.localmodel.sharedPVCImportFSGroup. The Jobs run in the cache's namespace under restricted-v2, which rejects a group outside the namespace's range. Leave it null so admission assigns the namespace's group, which the pods mounting the claim also get.
  sharedPVCImportFSGroup: null
  localmodelnode:
    # -- UID the node agent runs as. It owns the model cache on the node.
    runAsUser: 1000
    # -- GID the node agent runs as. Download Jobs share it through their fsGroup (kserve.localmodel.securityContext.fsGroup), so both can write the cache.
    runAsGroup: 1000
    # -- SELinux type for the node agent pod, including its init container. spc_t lets the agent read cache files whatever SELinux categories the pods that wrote or mounted them used, and lets the init container relabel the host directory. Empty uses the runtime default (container_t).
    seLinuxType: spc_t
    prepareHostPath:
      # -- Run an init container that creates the cache directory, gives it to runAsUser:runAsGroup and labels it container_file_t so SELinux lets pods write it. Disable it if you prepare the nodes yourself, for example with a MachineConfig.
      enabled: true
      # -- Image for the init container. It needs sh, mkdir, chown, chmod and chcon.
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
