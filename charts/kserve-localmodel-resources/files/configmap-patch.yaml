---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kserve-localmodel-config
data:
  localModel: |-
    {
      "jobNamespace": "{{ .Values.kserve.localmodel.jobNamespace }}",
      "jobTTLSecondsAfterFinished": {{ .Values.kserve.localmodel.jobTTLSecondsAfterFinished }},
      "defaultJobImage": "{{ .Values.kserve.localmodel.defaultJobImage }}:{{ .Values.kserve.localmodel.defaultJobTag | default .Values.kserve.version }}",
      "fsGroup": {{ .Values.kserve.localmodel.securityContext.fsGroup }},
      {{- $importFSGroup := .Values.kserve.localmodel.sharedPVCImportFSGroup }}
      {{- if .Values.openshift.enabled }}
      {{- $importFSGroup = .Values.openshift.sharedPVCImportFSGroup }}
      {{- end }}
      {{- if not (kindIs "invalid" $importFSGroup) }}
      "sharedPVCImportFSGroup": {{ $importFSGroup }},
      {{- end }}
      "reconcilationFrequencyInSecs": {{ .Values.kserve.localmodel.agent.reconcilationFrequencyInSecs }},
      "disableVolumeManagement": {{ .Values.kserve.localmodel.disableVolumeManagement }}
    }
  storageInitializer: |-
    {
        "image" : "{{ .Values.kserve.storage.image }}:{{ .Values.kserve.storage.tag | default .Values.kserve.version }}",
        "memoryRequest": "{{ .Values.kserve.storage.resources.requests.memory }}",
        "memoryLimit": "{{ .Values.kserve.storage.resources.limits.memory }}",
        "cpuRequest": "{{ .Values.kserve.storage.resources.requests.cpu }}",
        "cpuLimit": "{{ .Values.kserve.storage.resources.limits.cpu }}",
        "caBundleConfigMapName": "{{ .Values.kserve.storage.caBundleConfigMapName }}",
        "caBundleVolumeMountPath": "{{ .Values.kserve.storage.caBundleVolumeMountPath }}"
        {{- if .Values.kserve.storage.enableOciModelSupport }},
        "enableOciModelSupport": {{ .Values.kserve.storage.enableOciModelSupport }}
        {{- end }}
        {{- if .Values.kserve.storage.ociModelMode }},
        "ociModelMode": "{{ .Values.kserve.storage.ociModelMode }}"
        {{- end }}
    }
  credentials: |-
    {
       "storageSpecSecretName": "{{ .Values.kserve.storage.storageSpecSecretName }}",
       "storageSecretNameAnnotation": "{{ .Values.kserve.storage.storageSecretNameAnnotation }}",
       "gcs": {
           "gcsCredentialFileName": "gcloud-application-credentials.json"
       },
       "s3": {
           "s3AccessKeyIDName": "{{ .Values.kserve.storage.s3.accessKeyIdName }}",
           "s3SecretAccessKeyName": "{{ .Values.kserve.storage.s3.secretAccessKeyName }}",
           "s3Endpoint": "{{ .Values.kserve.storage.s3.endpoint }}",
           "s3UseHttps": "{{ .Values.kserve.storage.s3.useHttps }}",
           "s3Region": "{{ .Values.kserve.storage.s3.region }}",
           "s3VerifySSL": "{{ .Values.kserve.storage.s3.verifySSL }}",
           "s3UseVirtualBucket": "{{ .Values.kserve.storage.s3.useVirtualBucket }}",
           "s3UseAnonymousCredential": "{{ .Values.kserve.storage.s3.useAnonymousCredential }}",
           "s3CABundleConfigMap": "{{ .Values.kserve.storage.s3.CABundleConfigMap }}",
           "s3CABundle": "{{ .Values.kserve.storage.s3.CABundle }}"
       }
    }
  kernelcache: |-
    {
      "enabled": {{ .Values.kserve.kernelcache.enabled }},
      "defaultSidecarInjection": {{ .Values.kserve.kernelcache.defaultSidecarInjection }},
      "defaultMountType": "{{ .Values.kserve.kernelcache.defaultMountType }}",
      "defaultNodeGroup": "{{ .Values.kserve.kernelcache.defaultNodeGroup }}",
      "jobNamespace": "{{ .Values.kserve.kernelcache.jobNamespace }}",
      "mcvImage": "{{ .Values.kserve.kernelcache.mcvImage }}:{{ .Values.kserve.kernelcache.mcvTag | default (printf "%s-minimal" .Values.kserve.version) }}",
      "prefetchImage": "{{ .Values.kserve.kernelcache.prefetchImage }}{{ if .Values.kserve.kernelcache.prefetchTag }}:{{ .Values.kserve.kernelcache.prefetchTag }}{{ end }}",
      "runtimeImagePrefetch": {
        "enabled": {{ .Values.kserve.kernelcache.runtimeImagePrefetch.enabled }},
        "jobTTLSecondsAfterFinished": {{ .Values.kserve.kernelcache.runtimeImagePrefetch.jobTTLSecondsAfterFinished }}
      },
      "registry": {
        "endpoint": {{ .Values.kserve.kernelcache.registry.endpoint | toJson }},
{{ if or .Values.kserve.kernelcache.registry.caConfigMapRef.name .Values.kserve.kernelcache.registry.caConfigMapRef.key }}
        "caConfigMapRef": {
          "name": {{ .Values.kserve.kernelcache.registry.caConfigMapRef.name | toJson }},
          "key": {{ .Values.kserve.kernelcache.registry.caConfigMapRef.key | toJson }}
        },
{{ end }}
        "auth": {
          "type": {{ .Values.kserve.kernelcache.registry.auth.type | toJson }},
          "tokenTTLSeconds": {{ .Values.kserve.kernelcache.registry.auth.tokenTTLSeconds }}{{ if or .Values.kserve.kernelcache.registry.auth.pushRoleRef.kind .Values.kserve.kernelcache.registry.auth.pushRoleRef.name .Values.kserve.kernelcache.registry.auth.pullRoleRef.kind .Values.kserve.kernelcache.registry.auth.pullRoleRef.name }},{{ end }}
{{ if or .Values.kserve.kernelcache.registry.auth.pushRoleRef.kind .Values.kserve.kernelcache.registry.auth.pushRoleRef.name }}
          "pushRoleRef": {
            "kind": {{ .Values.kserve.kernelcache.registry.auth.pushRoleRef.kind | toJson }},
            "name": {{ .Values.kserve.kernelcache.registry.auth.pushRoleRef.name | toJson }}
          }{{ if or .Values.kserve.kernelcache.registry.auth.pullRoleRef.kind .Values.kserve.kernelcache.registry.auth.pullRoleRef.name }},{{ end }}
{{ end }}
{{ if or .Values.kserve.kernelcache.registry.auth.pullRoleRef.kind .Values.kserve.kernelcache.registry.auth.pullRoleRef.name }}
          "pullRoleRef": {
            "kind": {{ .Values.kserve.kernelcache.registry.auth.pullRoleRef.kind | toJson }},
            "name": {{ .Values.kserve.kernelcache.registry.auth.pullRoleRef.name | toJson }}
          }
{{ end }}
        }
      },
      "artifactSecurity": {
        "mode": {{ .Values.kserve.kernelcache.artifactSecurity.mode | toJson }},
        "failurePolicy": {{ .Values.kserve.kernelcache.artifactSecurity.failurePolicy | toJson }}{{ if or .Values.kserve.kernelcache.artifactSecurity.cert.signingProfileRef .Values.kserve.kernelcache.artifactSecurity.cert.trustBundle .Values.kserve.kernelcache.artifactSecurity.cert.trustBundleKey .Values.kserve.kernelcache.artifactSecurity.cert.subjectRegexp }},{{ end }}
{{ if or .Values.kserve.kernelcache.artifactSecurity.cert.signingProfileRef .Values.kserve.kernelcache.artifactSecurity.cert.trustBundle .Values.kserve.kernelcache.artifactSecurity.cert.trustBundleKey .Values.kserve.kernelcache.artifactSecurity.cert.subjectRegexp }}
        "cert": {
          "signingProfileRef": {{ .Values.kserve.kernelcache.artifactSecurity.cert.signingProfileRef | toJson }},
          "trustBundle": {{ .Values.kserve.kernelcache.artifactSecurity.cert.trustBundle | toJson }},
          "trustBundleKey": {{ .Values.kserve.kernelcache.artifactSecurity.cert.trustBundleKey | toJson }},
          "subjectRegexp": {{ .Values.kserve.kernelcache.artifactSecurity.cert.subjectRegexp | toJson }}
        }
{{ end }}
      },
      "abandonedCapturePolicy": "{{ .Values.kserve.kernelcache.abandonedCapturePolicy }}",
      "jobTTLSecondsAfterFinished": {{ .Values.kserve.kernelcache.jobTTLSecondsAfterFinished }},
      "mcvCaptureReadinessTimeoutSeconds": {{ .Values.kserve.kernelcache.mcvCaptureReadinessTimeoutSeconds }},
      "reconcileIntervalSeconds": {{ .Values.kserve.kernelcache.reconcileIntervalSeconds }}
    }
