kserve:
  version: v0.1.0
  storage:
    image: ghcr.io/talt5/storage-initializer
    tag: ''
    resources:
      requests:
        memory: 100Mi
        cpu: 100m
      limits:
        memory: 4Gi
        cpu: '2'
    # enableOciModelSupport turns on any OCI-backed model storage path (modelcar,
    # native ImageVolume, or fetch). Only rendered into the storageInitializer
    # config when true, so the default leaves the shipped config untouched.
    enableOciModelSupport: false
    # ociModelMode picks the materialization strategy for oci:// storageUris that
    # carry no explicit suffix. One of: modelcar | native | fetch.
    # Only rendered into the storageInitializer config when non-empty.
    ociModelMode: ''
    # -- ConfigMap with the CA certificates (key cabundle.crt) that downloads trust. Create it in every namespace that runs download Jobs: kserve.localmodel.jobNamespace, and the namespace of each shared-PVC cache. A ConfigMap named by the storage credentials takes precedence.
    caBundleConfigMapName: ''
    caBundleVolumeMountPath: /etc/ssl/custom-certs
    storageSpecSecretName: storage-config
    storageSecretNameAnnotation: serving.kserve.io/secretName
    s3:
      accessKeyIdName: AWS_ACCESS_KEY_ID
      secretAccessKeyName: AWS_SECRET_ACCESS_KEY
      endpoint: ''
      useHttps: ''
      region: ''
      verifySSL: ''
      useVirtualBucket: ''
      useAnonymousCredential: ''
      CABundleConfigMap: ''
      CABundle: ''
  localmodel:
    controller:
      image: ghcr.io/talt5/kserve-localmodel-controller
      tag: ''
    jobNamespace: kserve-localmodel-jobs
    jobTTLSecondsAfterFinished: 3600
    defaultJobImage: ghcr.io/talt5/storage-initializer
    defaultJobTag: ''
    securityContext:
      fsGroup: 1000
    # -- (int) fsGroup for shared-PVC import Jobs, which run in the cache's namespace. Independent of securityContext.fsGroup (per-node download Jobs). Set to null to omit it and let namespace admission (e.g. an OpenShift SCC) assign the group.
    sharedPVCImportFSGroup: 1000
    disableVolumeManagement: false
    agent:
      reconcilationFrequencyInSecs: 60
  kernelcache:
    enabled: false
    defaultSidecarInjection: true
    defaultMountType: 'oci'
    defaultNodeGroup: ''
    jobNamespace: 'kserve-kernelcache-jobs'
    mcvImage: 'ghcr.io/talt5/kserve-mcv'
    mcvTag: ''
    prefetchImage: 'registry.access.redhat.com/ubi9/ubi-minimal:latest'
    prefetchTag: ''
    runtimeImagePrefetch:
      enabled: false
      jobTTLSecondsAfterFinished: 86400
    registry:
      endpoint: ''
      caConfigMapRef:
        name: ''
        key: ''
      auth:
        type: 'none'
        tokenTTLSeconds: 600
        pushRoleRef:
          kind: ''
          name: ''
        pullRoleRef:
          kind: ''
          name: ''
    artifactSecurity:
      mode: 'cert'
      failurePolicy: 'reject'
      cert:
        signingProfileRef: 'kernelcache-signer'
        trustBundle: 'kserve/kernelcache-root-ca'
        trustBundleKey: ''
        subjectRegexp: 'spiffe://kserve/kernelcache-signer'
    abandonedCapturePolicy: 'retain'
    jobTTLSecondsAfterFinished: 600
    mcvCaptureReadinessTimeoutSeconds: 600
    reconcileIntervalSeconds: 300
