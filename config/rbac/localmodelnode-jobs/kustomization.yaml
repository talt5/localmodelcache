apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What the node agent may do in the namespace of the download Jobs. It is not part of
# config/localmodels, which puts everything in the namespace of the controller. Change the
# namespace here when you change localModel.jobNamespace.
namespace: localmodelcache-jobs

labels:
- pairs:
    app.kubernetes.io/name: localmodelcache
    app.kubernetes.io/component: localmodel

resources:
- role.yaml
- role_binding.yaml
