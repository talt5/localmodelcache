---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: localmodelcache-node-agent-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - local.cache.ai
  resources:
  - clusterstoragecontainers
  - localmodelnodegroups
  - localmodelnodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - local.cache.ai
  resources:
  - localmodelnodes/finalizers
  verbs:
  - update
- apiGroups:
  - local.cache.ai
  resources:
  - localmodelnodes/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: localmodelcache-node-agent-role
  namespace: localmodelcache
rules:
- apiGroups:
  - ""
  resourceNames:
  - localmodelcache-config
  resources:
  - configmaps
  verbs:
  - get
