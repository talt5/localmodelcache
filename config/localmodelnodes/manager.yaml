apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: localmodelcache-node-agent
  namespace: localmodelcache
  labels:
    app.kubernetes.io/name: localmodelcache-node-agent
    control-plane: localmodelcache-node-agent
    controller-tools.k8s.io: "1.0"
spec:
  selector:
    matchLabels:
      control-plane: localmodelcache-node-agent
      controller-tools.k8s.io: "1.0"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localmodelcache-node-agent
        control-plane: localmodelcache-node-agent
        controller-tools.k8s.io: "1.0"
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      nodeSelector:
        local.cache.ai/node: worker
      serviceAccountName: localmodelcache-node-agent
      securityContext:
        # The user of the download Jobs, to delete what they create, and their fsGroup.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        image: ko://github.com/talt5/localmodelcache/cmd/localmodelnode
        imagePullPolicy: Always
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - mountPath: /mnt/models
            name: models
            readOnly: false
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 100m
            memory: 200Mi
      volumes:
        - name: models
          hostPath:
            path: /mnt/models
            type: DirectoryOrCreate
      terminationGracePeriodSeconds: 10
