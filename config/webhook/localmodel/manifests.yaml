---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: localmodelcache.local.cache.ai
webhooks:
  - clientConfig:
      service:
        name: $(webhookServiceName)
        namespace: $(systemNamespace)
        path: /validate-local-cache-ai-v1alpha1-localmodelcache
    failurePolicy: Fail
    name: localmodelcache-validator.webhook.local.cache.ai
    # It looks for Pods in every namespace that has a claim of the cache.
    timeoutSeconds: 30
    sideEffects: None
    admissionReviewVersions: ["v1beta1"]
    rules:
      - apiGroups:
          - local.cache.ai
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - localmodelcaches
  # Validates storage mode, node groups and shared-PVC destinations, and denies deleting a
  # node-local cache while a Pod in its namespace mounts one of its claims.
  - clientConfig:
      service:
        name: $(webhookServiceName)
        namespace: $(systemNamespace)
        path: /validate-local-cache-ai-v1alpha1-localmodelnamespacecache
    failurePolicy: Fail
    name: localmodelnamespacecache-validator.webhook.local.cache.ai
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups:
          - local.cache.ai
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - localmodelnamespacecaches
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: kernelcache.local.cache.ai
  annotations:
    cert-manager.io/inject-ca-from: $(systemNamespace)/localmodel-serving-cert
webhooks:
  - clientConfig:
      service:
        name: $(webhookServiceName)
        namespace: $(systemNamespace)
        path: /mutate-kernelcache-pods
    # The kernel cache only saves time: while the controller is down, Pods start without it.
    failurePolicy: Ignore
    name: kernelcache-pod-mutator.webhook.local.cache.ai
    sideEffects: None
    reinvocationPolicy: IfNeeded
    admissionReviewVersions: ["v1"]
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: DoesNotExist
    matchConditions:
      - name: kernelcache-opt-in
        expression: >-
          has(object.metadata.annotations) &&
          'local.cache.ai/kernelcache-supported' in object.metadata.annotations &&
          object.metadata.annotations['local.cache.ai/kernelcache-supported'] == 'true'
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: kernelcachecapture.local.cache.ai
  annotations:
    cert-manager.io/inject-ca-from: $(systemNamespace)/localmodel-serving-cert
webhooks:
  - clientConfig:
      service:
        name: $(webhookServiceName)
        namespace: $(systemNamespace)
        path: /validate-kernelcachecapture-status
    failurePolicy: Fail
    name: kernelcachecapture-status-validator.webhook.local.cache.ai
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups:
          - local.cache.ai
        apiVersions:
          - v1alpha1
        operations:
          - UPDATE
        resources:
          - kernelcachecaptures/status
