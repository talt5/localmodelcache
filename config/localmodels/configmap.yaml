apiVersion: v1
kind: ConfigMap
metadata:
  name: localmodelcache-config
  namespace: localmodelcache
data:
  # Settings for the LocalModelCache controller and the LocalModelNode agent.
  #   jobNamespace: namespace of the per-node download Jobs and their PVCs.
  #   defaultJobImage: download image when no ClusterStorageContainer with
  #     workloadType localModelDownloadJob matches the source URI.
  #   fsGroup: fsGroup of the per-node download Jobs.
  #   sharedPVCImportFSGroup: fsGroup of shared-PVC import Jobs, which run in the
  #     cache's namespace. Omit it to let namespace admission assign the group.
  #   tolerations: tolerations of the per-node download Jobs. Give them those of the node agent,
  #     or downloads never start on tainted nodes.
  #   disableVolumeManagement: true stops the controller from creating the
  #     <cache>-<node group> claims that workloads mount.
  localModel: |-
    {
      "jobNamespace": "localmodelcache-jobs",
      "defaultJobImage": "ghcr.io/talt5/localmodelcache-storage-initializer:latest",
      "fsGroup": 1000,
      "sharedPVCImportFSGroup": 1000,
      "jobTTLSecondsAfterFinished": 3600,
      "reconcilationFrequencyInSecs": 60,
      "disableVolumeManagement": false
    }
  # Resources and options of the download container. caBundleConfigMapName names a ConfigMap
  # (key cabundle.crt) that must exist in each namespace that runs download Jobs.
  storageInitializer: |-
    {
        "image" : "ghcr.io/talt5/localmodelcache-storage-initializer:latest",
        "memoryRequest": "100Mi",
        "memoryLimit": "4Gi",
        "cpuRequest": "100m",
        "cpuLimit": "2",
        "caBundleConfigMapName": "",
        "caBundleVolumeMountPath": "/etc/ssl/custom-certs"
    }
  # How download Jobs find storage credentials.
  credentials: |-
    {
       "storageSpecSecretName": "storage-config",
       "storageSecretNameAnnotation": "local.cache.ai/storageSecretName",
       "gcs": {
           "gcsCredentialFileName": "gcloud-application-credentials.json"
       },
       "s3": {
           "s3AccessKeyIDName": "AWS_ACCESS_KEY_ID",
           "s3SecretAccessKeyName": "AWS_SECRET_ACCESS_KEY",
           "s3Endpoint": "",
           "s3UseHttps": "",
           "s3Region": "",
           "s3VerifySSL": "",
           "s3UseVirtualBucket": "",
           "s3UseAccelerate": "",
           "s3UseAnonymousCredential": "",
           "s3CABundleConfigMap": "",
           "s3CABundle": ""
       }
    }
  # Kernel cache settings: capture, prefetch, registry and artifact signing.
  kernelcache: |-
    {
      "enabled": false,
      "defaultSidecarInjection": true,
      "defaultMountType": "oci",
      "defaultNodeGroup": "",
      "jobNamespace": "localmodelcache-kernelcache-jobs",
      "mcvImage": "ghcr.io/talt5/localmodelcache-mcv:latest-minimal",
      "prefetchImage": "registry.access.redhat.com/ubi9/ubi-minimal:latest",
      "runtimeImagePrefetch": {
        "enabled": false,
        "jobTTLSecondsAfterFinished": 86400
      },
      "registry": {
        "auth": {
          "type": "none"
        }
      },
      "artifactSecurity": {
        "mode": "cert",
        "failurePolicy": "reject",
        "cert": {
          "signingProfileRef": "kernelcache-signer",
          "trustBundle": "localmodelcache/kernelcache-root-ca",
          "subjectRegexp": "spiffe://localmodelcache/kernelcache-signer"
        }
      },
      "abandonedCapturePolicy": "retain",
      "jobTTLSecondsAfterFinished": 600,
      "mcvCaptureReadinessTimeoutSeconds": 600,
      "reconcileIntervalSeconds": 300
    }
