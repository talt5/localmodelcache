apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: localmodelcache

labels:
- pairs:
    app.kubernetes.io/name: localmodelcache
    app.kubernetes.io/component: localmodel

resources:
- configmap.yaml
- ../certmanager/localmodel
- ../rbac/localmodel
- ../rbac/kernelcache
- manager.yaml
- ../localmodelnodes
- ../kernelcachenodes
- ../webhook/localmodel

patches:
- path: webhook_cainjection_patch.yaml
- path: localmodel_manager_image_patch.yaml


replacements:
# Replace the namespace with the namespace of the controller manager.
- source:
    fieldPath: metadata.namespace
    kind: Deployment
    name: localmodelcache-controller-manager
    version: v1
  targets:
  - fieldPaths:
    - webhooks.*.clientConfig.service.namespace
    select:
      kind: ValidatingWebhookConfiguration
      name: localmodelcache.local.cache.ai
  - fieldPaths:
    - webhooks.*.clientConfig.service.namespace
    select:
      kind: ValidatingWebhookConfiguration
      name: kernelcachecapture.local.cache.ai
  - fieldPaths:
    - webhooks.*.clientConfig.service.namespace
    select:
      kind: MutatingWebhookConfiguration
      name: kernelcache.local.cache.ai
  - fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 0
    select:
      kind: ValidatingWebhookConfiguration
      name: localmodelcache.local.cache.ai
  - fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 0
    select:
      kind: ValidatingWebhookConfiguration
      name: kernelcachecapture.local.cache.ai
  - fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 0
    select:
      kind: MutatingWebhookConfiguration
      name: kernelcache.local.cache.ai
  - fieldPaths:
    - spec.commonName
    - spec.dnsNames.0
    options:
      delimiter: '.'
      index: 1
    select:
      kind: Certificate
      name: localmodel-serving-cert
      namespace: localmodelcache
# Replace localmodel webhook service name
- source:
    fieldPath: metadata.name
    kind: Service
    name: localmodel-webhook-server-service
    version: v1
  targets:
  - fieldPaths:
    - webhooks.*.clientConfig.service.name
    select:
      kind: ValidatingWebhookConfiguration
      name: localmodelcache.local.cache.ai
  - fieldPaths:
    - webhooks.*.clientConfig.service.name
    select:
      kind: ValidatingWebhookConfiguration
      name: kernelcachecapture.local.cache.ai
  - fieldPaths:
    - webhooks.*.clientConfig.service.name
    select:
      kind: MutatingWebhookConfiguration
      name: kernelcache.local.cache.ai
  - fieldPaths:
    - spec.commonName
    - spec.dnsNames.0
    options:
      delimiter: '.'
      index: 0
    select:
      kind: Certificate
      name: localmodel-serving-cert
      namespace: localmodelcache
