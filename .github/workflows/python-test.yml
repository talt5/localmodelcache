name: Python package

on:
  push:
    branches: [master, release*]
    paths-ignore:
      - "**.md"
  pull_request:
    paths:
      - "python/**"
      - "!.github/**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/python-test.yml"
      - ".github/actions/free-up-disk-space/**"
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Merge target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow origin
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git config user.email "ci@kserve.io"
          git config user.name "CI Bot"
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}

      - name: Free-up disk space
        uses: ./.github/actions/free-up-disk-space

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv
        
      # The model downloader (storage-initializer image) is the only Python package.
      - name: Install kserve-storage
        run: |
          cd python/storage
          uv venv .venv
          uv pip install --python .venv/bin/python ".[confidential]" pytest pytest-cov zstandard
      - name: Test kserve-storage
        run: |
          cd python/storage
          .venv/bin/python -m pytest --cov=kserve_storage --junitxml=/tmp/junit_unit_storage.xml ./test

      - name: Upload unit test results
        if: always()
        uses: ./.github/actions/upload-test-results
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: /tmp/junit_unit_*.xml
